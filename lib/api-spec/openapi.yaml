openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: businesses
    description: Student-owned businesses and public listings
  - name: bookings
    description: Resident booking requests and student booking management
  - name: moderation
    description: Administrator business review and email log
  - name: guardian
    description: Guardian approval links
  - name: storage
    description: Private business photo uploads
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /businesses/public:
    get:
      operationId: getPublicBusinesses
      tags: [businesses]
      summary: List live businesses
      responses:
        "200":
          description: Public business listings without private contact or address fields
          content:
            application/json:
              schema:
                type: object
                properties:
                  businesses:
                    type: array
                    items:
                      $ref: "#/components/schemas/PublicBusiness"
                required: [businesses]
  /businesses/mine:
    get:
      operationId: getMyBusinesses
      tags: [businesses]
      summary: List the signed-in student's businesses
      responses:
        "200":
          description: Businesses owned by the signed-in student
          content:
            application/json:
              schema:
                type: object
                properties:
                  businesses:
                    type: array
                    items:
                      $ref: "#/components/schemas/StudentBusiness"
                required: [businesses]
        "401":
          description: Sign in required
        "403":
          description: Student role required
  /businesses:
    post:
      operationId: createBusiness
      tags: [businesses]
      summary: Create a business for the signed-in student
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessInput"
      responses:
        "201":
          description: Business created and queued for administrator review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentBusiness"
        "400":
          description: Invalid business details
        "401":
          description: Sign in required
        "403":
          description: Student role and completed profile required
  /businesses/{businessId}:
    patch:
      operationId: updateBusiness
      tags: [businesses]
      summary: Update a business owned by the signed-in student
      parameters:
        - name: businessId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessUpdateInput"
      responses:
        "200":
          description: Updated business
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentBusiness"
        "403":
          description: Student role or ownership required
        "404":
          description: Business not found
  /businesses/{businessId}/pause:
    post:
      operationId: setBusinessPause
      tags: [businesses]
      summary: Pause or unpause an owned business
      parameters:
        - name: businessId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                paused:
                  type: boolean
              required: [paused]
      responses:
        "200":
          description: Updated business status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentBusiness"
        "403":
          description: Student role or ownership required
  /bookings/incoming:
    get:
      operationId: getIncomingBookings
      tags: [bookings]
      summary: List requests for the signed-in student's businesses
      responses:
        "200":
          description: Booking requests with only resident first name and street name
          content:
            application/json:
              schema:
                type: object
                properties:
                  bookings:
                    type: array
                    items:
                      $ref: "#/components/schemas/IncomingBooking"
                required: [bookings]
        "401":
          description: Sign in required
        "403":
          description: Student role required
  /bookings/mine:
    get:
      operationId: getMyBookings
      tags: [bookings]
      summary: List bookings for the signed-in resident
      responses:
        "200":
          description: The resident's booking history without private student data
          content:
            application/json:
              schema:
                type: object
                properties:
                  bookings:
                    type: array
                    items:
                      $ref: "#/components/schemas/ResidentBooking"
                required: [bookings]
        "401":
          description: Sign in required
        "403":
          description: Resident role required
  /bookings:
    post:
      operationId: createBooking
      tags: [bookings]
      summary: Request a live business booking as a resident
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingInput"
      responses:
        "201":
          description: Booking request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingCreated"
        "400":
          description: Invalid booking details
        "401":
          description: Sign in required
        "403":
          description: Resident role and profile required
        "404":
          description: Business is not available for booking
        "429":
          description: Too many booking requests
  /bookings/{bookingId}/status:
    patch:
      operationId: updateBookingStatus
      tags: [bookings]
      summary: Accept, decline, or complete a booking owned by the student
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingStatusInput"
      responses:
        "200":
          description: Booking status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncomingBooking"
        "400":
          description: Invalid action
        "401":
          description: Sign in required
        "403":
          description: Student role and business ownership required
        "404":
          description: Booking not found
        "409":
          description: Booking cannot move to the requested status
  /bookings/{bookingId}/cancel:
    post:
      operationId: cancelBooking
      tags: [bookings]
      summary: Cancel the signed-in resident's unfinished booking
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Booking cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResidentBooking"
        "401":
          description: Sign in required
        "403":
          description: Resident role and booking ownership required
        "404":
          description: Booking not found
        "409":
          description: A completed or already cancelled booking cannot be cancelled
  /admin/businesses:
    get:
      operationId: getAdminBusinesses
      tags: [moderation]
      summary: List businesses for administrator review and management
      responses:
        "200":
          description: Full moderation details including private student and guardian information
          content:
            application/json:
              schema:
                type: object
                properties:
                  businesses:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminBusiness"
                required: [businesses]
        "403":
          description: Administrator role required
  /admin/businesses/{businessId}/review:
    post:
      operationId: reviewBusiness
      tags: [moderation]
      summary: Approve or reject a business
      parameters:
        - name: businessId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [approve, reject]
                reason:
                  type: string
                  maxLength: 1000
              required: [action]
      responses:
        "200":
          description: Moderation action recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBusiness"
        "400":
          description: Invalid action or missing rejection reason
        "403":
          description: Administrator role required
        "404":
          description: Business not found
  /admin/businesses/{businessId}/pause:
    post:
      operationId: setAdminBusinessPause
      tags: [moderation]
      summary: Pause or restore a business as administrator
      parameters:
        - name: businessId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                paused:
                  type: boolean
              required: [paused]
      responses:
        "200":
          description: Updated business moderation status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBusiness"
        "403":
          description: Administrator role required
  /admin/email-log:
    get:
      operationId: getAdminEmailLog
      tags: [moderation]
      summary: Read the in-memory email log
      responses:
        "200":
          description: Recent email attempts for testing
          content:
            application/json:
              schema:
                type: object
                properties:
                  emails:
                    type: array
                    items:
                      $ref: "#/components/schemas/EmailLogEntry"
                  notice:
                    type: string
                required: [emails, notice]
        "403":
          description: Administrator role required
  /guardian/approvals/{token}:
    get:
      operationId: getGuardianApproval
      tags: [guardian]
      summary: View a single-use guardian approval
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Approval request details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuardianApproval"
        "404":
          description: Link is invalid, expired, or already used
    post:
      operationId: submitGuardianApproval
      tags: [guardian]
      summary: Approve or decline a business for a student
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                decision:
                  type: string
                  enum: [approved, declined]
              required: [decision]
      responses:
        "200":
          description: Guardian decision recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  decision:
                    type: string
                    enum: [approved, declined]
                required: [ok, decision]
        "404":
          description: Link is invalid, expired, or already used
  /storage/uploads/request-url:
    post:
      operationId: requestBusinessPhotoUpload
      tags: [storage]
      summary: Request a signed photo upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                size:
                  type: integer
                  minimum: 1
                  maximum: 215040
                contentType:
                  type: string
                  enum: [image/webp]
              required: [name, size, contentType]
      responses:
        "200":
          description: Signed upload URL and private object path
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploadURL:
                    type: string
                    format: uri
                  objectPath:
                    type: string
                  metadata:
                    type: object
                    properties:
                      name:
                        type: string
                      size:
                        type: integer
                      contentType:
                        type: string
                    required: [name, size, contentType]
                required: [uploadURL, objectPath, metadata]
        "403":
          description: Student role required
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    BusinessCategory:
      type: string
      enum:
        - Bin cleaning
        - Lawn care
        - Babysitting
        - Pet care
        - Digital support
        - Hauling
        - Tutoring
        - Others
    BusinessStatus:
      type: string
      enum: [pending_review, pending_guardian, live, paused, rejected]
    BookingStatus:
      type: string
      enum: [requested, accepted, declined, completed, cancelled]
    BookingInput:
      type: object
      properties:
        businessId:
          type: string
          format: uuid
        message:
          type: string
          minLength: 3
          maxLength: 2000
        preferredTiming:
          type: string
          maxLength: 300
      required: [businessId, message]
    BookingStatusInput:
      type: object
      properties:
        action:
          type: string
          enum: [accept, decline, complete]
      required: [action]
    BookingCreated:
      type: object
      properties:
        id:
          type: string
          format: uuid
        businessId:
          type: string
          format: uuid
        businessName:
          type: string
        status:
          $ref: "#/components/schemas/BookingStatus"
        createdAt:
          type: string
      required: [id, businessId, businessName, status, createdAt]
    IncomingBooking:
      type: object
      properties:
        id:
          type: string
          format: uuid
        businessId:
          type: string
          format: uuid
        businessName:
          type: string
        residentFirstName:
          type: string
        residentStreetName:
          type: [string, "null"]
        message:
          type: string
        preferredTiming:
          type: string
        status:
          $ref: "#/components/schemas/BookingStatus"
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, businessId, businessName, residentFirstName, residentStreetName, message, preferredTiming, status, createdAt, updatedAt]
    ResidentBooking:
      type: object
      properties:
        id:
          type: string
          format: uuid
        businessId:
          type: string
          format: uuid
        businessName:
          type: string
        category:
          $ref: "#/components/schemas/BusinessCategory"
        studentFirstName:
          type: string
        message:
          type: string
        preferredTiming:
          type: string
        status:
          $ref: "#/components/schemas/BookingStatus"
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, businessId, businessName, category, studentFirstName, message, preferredTiming, status, createdAt, updatedAt]
    BusinessInput:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        category:
          $ref: "#/components/schemas/BusinessCategory"
        description:
          type: string
          minLength: 10
          maxLength: 2000
        pricingText:
          type: string
          minLength: 1
          maxLength: 300
        photoPaths:
          type: array
          maxItems: 3
          items:
            type: string
            minLength: 1
      required: [name, category, description, pricingText, photoPaths]
    BusinessUpdateInput:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        category:
          $ref: "#/components/schemas/BusinessCategory"
        description:
          type: string
          minLength: 10
          maxLength: 2000
        pricingText:
          type: string
          minLength: 1
          maxLength: 300
        photoPaths:
          type: array
          maxItems: 3
          items:
            type: string
            minLength: 1
    PublicBusiness:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        category:
          $ref: "#/components/schemas/BusinessCategory"
        description:
          type: string
        pricingText:
          type: string
        studentName:
          type: string
        photoUrls:
          type: array
          items:
            type: string
      required: [id, name, category, description, pricingText, studentName, photoUrls]
    StudentBusiness:
      allOf:
        - $ref: "#/components/schemas/PublicBusiness"
        - type: object
          properties:
            photoPaths:
              type: array
              items:
                type: string
            status:
              $ref: "#/components/schemas/BusinessStatus"
            rejectionReason:
              type: [string, "null"]
            pausedBy:
              type: [string, "null"]
            createdAt:
              type: string
            updatedAt:
              type: string
          required: [photoPaths, status, rejectionReason, pausedBy, createdAt, updatedAt]
    AdminBusiness:
      allOf:
        - $ref: "#/components/schemas/StudentBusiness"
        - type: object
          properties:
            ownerName:
              type: string
            ownerEmail:
              type: string
            age:
              type: integer
            privateAddress:
              type: string
            guardianName:
              type: string
            guardianEmail:
              type: string
          required: [ownerName, ownerEmail, age, privateAddress, guardianName, guardianEmail]
    EmailLogEntry:
      type: object
      properties:
        id:
          type: string
        createdAt:
          type: string
        to:
          type: array
          items:
            type: string
        cc:
          type: array
          items:
            type: string
        subject:
          type: string
        text:
          type: string
        status:
          type: string
          enum: [logged, sent, failed]
        detail:
          type: [string, "null"]
      required: [id, createdAt, to, cc, subject, text, status, detail]
    GuardianApproval:
      type: object
      properties:
        businessName:
          type: string
        category:
          $ref: "#/components/schemas/BusinessCategory"
        studentName:
          type: string
        expired:
          type: boolean
        used:
          type: boolean
        decision:
          type: [string, "null"]
      required: [businessName, category, studentName, expired, used, decision]


openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: businesses
    description: Student-owned businesses and public listings
  - name: bookings
    description: Resident booking requests and student booking management
  - name: jobs
    description: Resident job posts, student applications, and guardian approval
  - name: moderation
    description: Administrator business review and email log
  - name: guardian
    description: Guardian dashboard, access, and approval links
  - name: messaging
    description: Private Launch Lane chat and moderation
  - name: storage
    description: Private business photo uploads
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /businesses/public:
    get:
      operationId: getPublicBusinesses
      tags: [businesses]
      summary: List live businesses
      responses:
        "200":
          description: Public business listings without private contact or address fields
          content:
            application/json:
              schema:
                type: object
                properties:
                  businesses:
                    type: array
                    items:
                      $ref: "#/components/schemas/PublicBusiness"
                required: [businesses]
  /businesses/mine:
    get:
      operationId: getMyBusinesses
      tags: [businesses]
      summary: List the signed-in student's businesses
      responses:
        "200":
          description: Businesses owned by the signed-in student
          content:
            application/json:
              schema:
                type: object
                properties:
                  businesses:
                    type: array
                    items:
                      $ref: "#/components/schemas/StudentBusiness"
                required: [businesses]
        "401":
          description: Sign in required
        "403":
          description: Student role required
  /businesses:
    post:
      operationId: createBusiness
      tags: [businesses]
      summary: Create a business for the signed-in student
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessInput"
      responses:
        "201":
          description: Business created and queued for administrator review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentBusiness"
        "400":
          description: Invalid business details
        "401":
          description: Sign in required
        "403":
          description: Student role and completed profile required
  /businesses/{businessId}:
    patch:
      operationId: updateBusiness
      tags: [businesses]
      summary: Update a business owned by the signed-in student
      parameters:
        - name: businessId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessUpdateInput"
      responses:
        "200":
          description: Updated business
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentBusiness"
        "403":
          description: Student role or ownership required
        "404":
          description: Business not found
  /businesses/{businessId}/pause:
    post:
      operationId: setBusinessPause
      tags: [businesses]
      summary: Pause or unpause an owned business
      parameters:
        - name: businessId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                paused:
                  type: boolean
              required: [paused]
      responses:
        "200":
          description: Updated business status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentBusiness"
        "403":
          description: Student role or ownership required
  /businesses/openings/mine:
    get:
      operationId: getMyBusinessOpenings
      tags: [businesses]
      summary: List openings posted for the signed-in student's businesses
      responses:
        "200":
          description: The owner's openings with approved applicant summaries
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items:
                      $ref: "#/components/schemas/ResidentJob"
                required: [jobs]
        "401":
          description: Sign in required
        "403":
          description: Student role required
  /businesses/{businessId}/openings:
    post:
      operationId: createBusinessOpening
      tags: [businesses]
      summary: Post an opening (a role) at the signed-in student's live business
      parameters:
        - name: businessId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobInput"
      responses:
        "201":
          description: Opening created and queued for administrator review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResidentJob"
        "400":
          description: Invalid opening details
        "401":
          description: Sign in required
        "403":
          description: Business ownership required
        "404":
          description: Business not found or not live
        "429":
          description: Too many posts
  /bookings/incoming:
    get:
      operationId: getIncomingBookings
      tags: [bookings]
      summary: List requests for the signed-in student's businesses
      responses:
        "200":
          description: Booking requests with only resident first name and street name
          content:
            application/json:
              schema:
                type: object
                properties:
                  bookings:
                    type: array
                    items:
                      $ref: "#/components/schemas/IncomingBooking"
                required: [bookings]
        "401":
          description: Sign in required
        "403":
          description: Student role required
  /bookings/mine:
    get:
      operationId: getMyBookings
      tags: [bookings]
      summary: List bookings for the signed-in resident
      responses:
        "200":
          description: The resident's booking history without private student data
          content:
            application/json:
              schema:
                type: object
                properties:
                  bookings:
                    type: array
                    items:
                      $ref: "#/components/schemas/ResidentBooking"
                required: [bookings]
        "401":
          description: Sign in required
        "403":
          description: Resident role required
  /bookings:
    post:
      operationId: createBooking
      tags: [bookings]
      summary: Request a live business booking as a resident
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingInput"
      responses:
        "201":
          description: Booking request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingCreated"
        "400":
          description: Invalid booking details
        "401":
          description: Sign in required
        "403":
          description: Resident role and profile required
        "404":
          description: Business is not available for booking
        "429":
          description: Too many booking requests
  /bookings/{bookingId}/status:
    patch:
      operationId: updateBookingStatus
      tags: [bookings]
      summary: Accept, decline, or complete a booking owned by the student
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingStatusInput"
      responses:
        "200":
          description: Booking status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncomingBooking"
        "400":
          description: Invalid action
        "401":
          description: Sign in required
        "403":
          description: Student role and business ownership required
        "404":
          description: Booking not found
        "409":
          description: Booking cannot move to the requested status
  /bookings/{bookingId}/cancel:
    post:
      operationId: cancelBooking
      tags: [bookings]
      summary: Cancel the signed-in resident's unfinished booking
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Booking cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResidentBooking"
        "401":
          description: Sign in required
        "403":
          description: Resident role and booking ownership required
        "404":
          description: Booking not found
        "409":
          description: A completed or already cancelled booking cannot be cancelled
  /jobs/public:
    get:
      operationId: getPublicJobs
      tags: [jobs]
      summary: List open jobs accepting applications
      responses:
        "200":
          description: Open jobs with resident street names only
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items:
                      $ref: "#/components/schemas/PublicJob"
                required: [jobs]
  /jobs/mine:
    get:
      operationId: getMyJobs
      tags: [jobs]
      summary: List jobs posted by the signed-in resident
      responses:
        "200":
          description: The resident's jobs and safe applicant summaries
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items:
                      $ref: "#/components/schemas/ResidentJob"
                required: [jobs]
        "401":
          description: Sign in required
        "403":
          description: Resident role required
  /jobs:
    post:
      operationId: createJob
      tags: [jobs]
      summary: Post a job as a resident
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobInput"
      responses:
        "201":
          description: Job created and queued for administrator review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResidentJob"
        "400":
          description: Invalid job details
        "401":
          description: Sign in required
        "403":
          description: Resident role and complete profile required
        "429":
          description: Too many job posts
  /jobs/{jobId}/applications:
    post:
      operationId: createJobApplication
      tags: [jobs]
      summary: Submit an application for administrator review
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobApplicationInput"
      responses:
        "201":
          description: Application submitted to administrator review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentJobApplication"
        "401":
          description: Sign in required
        "403":
          description: Student role and complete profile required
        "404":
          description: Job is not accepting applications
        "409":
          description: An active application already exists
        "429":
          description: Too many applications
  /jobs/applications/mine:
    get:
      operationId: getMyJobApplications
      tags: [jobs]
      summary: List the signed-in student's job applications
      responses:
        "200":
          description: The student's own application statuses, including administrator review
          content:
            application/json:
              schema:
                type: object
                properties:
                  applications:
                    type: array
                    items:
                      $ref: "#/components/schemas/StudentJobApplication"
                required: [applications]
        "401":
          description: Sign in required
        "403":
          description: Student role required
  /jobs/applications/{applicationId}/withdraw:
    post:
      operationId: withdrawJobApplication
      tags: [jobs]
      summary: Withdraw the signed-in student's application
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Application withdrawn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentJobApplication"
        "401":
          description: Sign in required
        "403":
          description: Student role and application ownership required
        "404":
          description: Application not found
        "409":
          description: Application cannot be withdrawn in its current state
  /jobs/{jobId}/applications/{applicationId}/choose:
    post:
      operationId: chooseJobApplicant
      tags: [jobs]
      summary: Choose an applicant and request guardian approval
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Applicant chosen; guardian approval requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResidentJob"
        "403":
          description: Resident role and job ownership required
        "404":
          description: Job or application not found
        "409":
          description: Job or application cannot be chosen
  /jobs/{jobId}/close:
    post:
      operationId: closeMyJob
      tags: [jobs]
      summary: Close a job owned by the signed-in resident
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Job closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResidentJob"
        "403":
          description: Resident role and job ownership required
        "404":
          description: Job not found
        "409":
          description: A filled job cannot be closed
  /admin/jobs:
    get:
      operationId: getAdminJobs
      tags: [jobs]
      summary: List jobs for administrator review and management
      responses:
        "200":
          description: Job details including residents' private addresses
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminJob"
                required: [jobs]
        "403":
          description: Administrator role required
  /admin/jobs/{jobId}/review:
    post:
      operationId: reviewJob
      tags: [jobs]
      summary: Approve or reject a job post
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobReviewInput"
      responses:
        "200":
          description: Moderation action recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminJob"
        "400":
          description: Invalid action or missing rejection reason
        "403":
          description: Administrator role required
        "404":
          description: Job not found
        "409":
          description: Job is no longer waiting for review
  /admin/jobs/{jobId}/close:
    post:
      operationId: closeAdminJob
      tags: [jobs]
      summary: Close or unpublish a job as administrator
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Job unpublished
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminJob"
        "403":
          description: Administrator role required
        "404":
          description: Job not found
        "409":
          description: Job cannot be unpublished in its current state
  /admin/job-applications:
    get:
      operationId: getAdminJobApplications
      tags: [jobs]
      summary: List job applications waiting for administrator review
      responses:
        "200":
          description: Pending applications and private student details for the administrator
          content:
            application/json:
              schema:
                type: object
                properties:
                  applications:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminJobApplication"
                required: [applications]
        "401":
          description: Sign in required
        "403":
          description: Administrator role required
  /admin/job-applications/{applicationId}/review:
    post:
      operationId: reviewJobApplication
      tags: [jobs]
      summary: Approve or reject a student job application
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobApplicationReviewInput"
      responses:
        "200":
          description: Application review recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminJobApplication"
        "400":
          description: Invalid action or missing rejection reason
        "401":
          description: Sign in required
        "403":
          description: Administrator role required
        "404":
          description: Application not found
        "409":
          description: Application is no longer waiting for review
  /admin/businesses:
    get:
      operationId: getAdminBusinesses
      tags: [moderation]
      summary: List businesses for administrator review and management
      responses:
        "200":
          description: Full moderation details including private student and guardian information
          content:
            application/json:
              schema:
                type: object
                properties:
                  businesses:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminBusiness"
                required: [businesses]
        "403":
          description: Administrator role required
  /admin/businesses/{businessId}/review:
    post:
      operationId: reviewBusiness
      tags: [moderation]
      summary: Approve or reject a business
      parameters:
        - name: businessId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [approve, reject]
                reason:
                  type: string
                  maxLength: 1000
              required: [action]
      responses:
        "200":
          description: Moderation action recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBusiness"
        "400":
          description: Invalid action or missing rejection reason
        "403":
          description: Administrator role required
        "404":
          description: Business not found
  /admin/businesses/{businessId}/media-review:
    post:
      operationId: reviewBusinessMedia
      tags: [moderation]
      summary: Approve or reject new photos/logo for an approved business
      parameters:
        - name: businessId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [approve, reject]
                reason:
                  type: string
                  maxLength: 1000
              required: [action]
      responses:
        "200":
          description: Media review recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBusiness"
        "400":
          description: Invalid action or missing rejection reason
        "403":
          description: Administrator role required
        "404":
          description: Business not found
        "409":
          description: No media waiting for review
  /admin/businesses/{businessId}/pause:
    post:
      operationId: setAdminBusinessPause
      tags: [moderation]
      summary: Pause or restore a business as administrator
      parameters:
        - name: businessId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                paused:
                  type: boolean
              required: [paused]
      responses:
        "200":
          description: Updated business moderation status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBusiness"
        "403":
          description: Administrator role required
  /admin/email-log:
    get:
      operationId: getAdminEmailLog
      tags: [moderation]
      summary: Read the administrator-only email log
      responses:
        "200":
          description: The latest 500 email attempts stored in the database
          content:
            application/json:
              schema:
                type: object
                properties:
                  emails:
                    type: array
                    items:
                      $ref: "#/components/schemas/EmailLogEntry"
                  notice:
                    type: string
                required: [emails, notice]
        "403":
          description: Administrator role required
  /messages:
    get:
      operationId: getChatThreads
      tags: [messaging]
      summary: List chat threads available to the signed-in account
      responses:
        "200":
          description: Threads visible to the signed-in participant or administrator
          content:
            application/json:
              schema:
                type: object
                properties:
                  threads:
                    type: array
                    items:
                      $ref: "#/components/schemas/ChatThreadSummary"
                required: [threads]
        "401":
          description: Sign in required
        "403":
          description: Complete account setup required
  /messages/unread-count:
    get:
      operationId: getChatUnreadCount
      tags: [messaging]
      summary: Count unread messages available to the signed-in account
      responses:
        "200":
          description: Unread message count
          content:
            application/json:
              schema:
                type: object
                properties:
                  unreadCount:
                    type: integer
                    minimum: 0
                required: [unreadCount]
        "401":
          description: Sign in required
        "403":
          description: Complete account setup required
  /messages/{threadId}:
    get:
      operationId: getChatThread
      tags: [messaging]
      summary: Read a thread and its text messages
      parameters:
        - name: threadId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Thread and messages visible to a participant or administrator
          content:
            application/json:
              schema:
                type: object
                properties:
                  thread:
                    $ref: "#/components/schemas/ChatThreadSummary"
                  messages:
                    type: array
                    items:
                      $ref: "#/components/schemas/ChatMessage"
                required: [thread, messages]
        "401":
          description: Sign in required
        "403":
          description: Thread participant or administrator access required
        "404":
          description: Thread not found
    post:
      operationId: createChatMessage
      tags: [messaging]
      summary: Send a text message to a thread
      parameters:
        - name: threadId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageInput"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"
        "400":
          description: Invalid message
        "401":
          description: Sign in required
        "403":
          description: Thread participant or administrator access required
        "404":
          description: Thread not found
        "409":
          description: Thread is locked
        "429":
          description: Too many messages
  /messages/{threadId}/read:
    post:
      operationId: markChatThreadRead
      tags: [messaging]
      summary: Mark a thread as read
      parameters:
        - name: threadId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Thread marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResponse"
        "401":
          description: Sign in required
        "403":
          description: Thread participant or administrator access required
        "404":
          description: Thread not found
  /messages/{threadId}/reports:
    post:
      operationId: reportChatMessage
      tags: [messaging]
      summary: Report a message to Launch Lane
      parameters:
        - name: threadId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatReportInput"
      responses:
        "201":
          description: Report submitted and administrator notified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResponse"
        "400":
          description: Invalid report
        "401":
          description: Sign in required
        "403":
          description: Thread participant or administrator access required
        "404":
          description: Message not found in this thread
  /admin/messages/reports:
    get:
      operationId: getAdminChatReports
      tags: [messaging]
      summary: List reported messages for administrator review
      responses:
        "200":
          description: Open message reports
          content:
            application/json:
              schema:
                type: object
                properties:
                  reports:
                    type: array
                    items:
                      $ref: "#/components/schemas/ChatReport"
                required: [reports]
        "401":
          description: Sign in required
        "403":
          description: Administrator role required
  /admin/messages/{messageId}:
    delete:
      operationId: deleteAdminChatMessage
      tags: [messaging]
      summary: Remove a message from a thread
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Message removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResponse"
        "401":
          description: Sign in required
        "403":
          description: Administrator role required
        "404":
          description: Message not found
  /admin/messages/threads/{threadId}:
    patch:
      operationId: setAdminChatThreadLock
      tags: [messaging]
      summary: Lock or unlock a chat thread
      parameters:
        - name: threadId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatThreadLockInput"
      responses:
        "200":
          description: Thread lock updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResponse"
        "401":
          description: Sign in required
        "403":
          description: Administrator role required
        "404":
          description: Thread not found
  /guardian/dashboard:
    get:
      operationId: getGuardianDashboard
      tags: [guardian]
      summary: List students linked to the verified guardian email
      responses:
        "200":
          description: Linked student businesses, bookings, job applications and chats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuardianDashboard"
        "401":
          description: Sign in required
        "403":
          description: Parent or Guardian role required
  /guardian/approvals/{token}:
    get:
      operationId: getGuardianApproval
      tags: [guardian]
      summary: View a single-use guardian approval
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Approval request details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuardianApproval"
        "404":
          description: Link is invalid, expired, or already used
    post:
      operationId: submitGuardianApproval
      tags: [guardian]
      summary: Approve or decline a business for a student
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                decision:
                  type: string
                  enum: [approved, declined]
              required: [decision]
      responses:
        "200":
          description: Guardian decision recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  decision:
                    type: string
                    enum: [approved, declined]
                required: [ok, decision]
        "404":
          description: Link is invalid, expired, or already used
  /storage/uploads/request-url:
    post:
      operationId: requestBusinessPhotoUpload
      tags: [storage]
      summary: Request a signed photo upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                size:
                  type: integer
                  minimum: 1
                  maximum: 215040
                contentType:
                  type: string
                  enum: [image/webp]
              required: [name, size, contentType]
      responses:
        "200":
          description: Signed upload URL and private object path
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploadURL:
                    type: string
                    format: uri
                  objectPath:
                    type: string
                  metadata:
                    type: object
                    properties:
                      name:
                        type: string
                      size:
                        type: integer
                      contentType:
                        type: string
                    required: [name, size, contentType]
                required: [uploadURL, objectPath, metadata]
        "403":
          description: Student role required
